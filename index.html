<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley - Índice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #f39c12;
            margin-bottom: 30px;
        }
        .menu {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }
        .card {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            background-color: #3d5a6f;
        }
        .card h2 {
            color: #f39c12;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Stardew Valley 🌾</h1>
        <div class="menu">
            <div class="card">
                <h2>Cultivos</h2>
                <p>Información sobre cultivos y estaciones</p>
            </div>
            <div class="card">
                <h2>Personajes</h2>
                <p>Conoce a los habitantes del pueblo</p>
            </div>
            <div class="card">
                <h2>Minas</h2>
                <p>Explora las minas y encuentra minerales</p>
            </div>
            <div class="card">
                <h2>Pesca</h2>
                <p>Técnicas y peces disponibles</p>
            </div>
        </div>
    </div>
</body>
</html>
